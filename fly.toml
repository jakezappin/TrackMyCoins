# Fly.io configuration. Deploy with: fly deploy
app = "trackmycoins"
primary_region = "iad"  # Ashburn, Virginia. List regions with: fly platform regions

[build]

[env]
  SIGNUP_MODE = "invite"  # registering needs INVITE_CODE (set with: fly secrets set INVITE_CODE=...)

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: price refreshes, the hourly spot record and the monthly price upkeep run in the background and
  # would stop whenever Fly put an idle machine to sleep. (About $3-4 a month for this size.)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

# SQLite database and photos. One machine only: SQLite lives on this single volume.
[[mounts]]
  source = "coin_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
